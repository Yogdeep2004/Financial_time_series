<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="TBC-GAN architecture: noise and a condition pass through a generator of Transformer, BiLSTM and CNN blocks to produce a 24-step synthetic window, scored by a critic trained with WGAN-GP. Results against baseline: 98.2% lower kurtosis error, 94% lower skewness deviation, 68.7% lower KS statistic, ACF MSE of 0.0107 over 20 lags."><title>TBC-GAN architecture: noise and a condition pass through a generator of Transformer, BiLSTM and CNN blocks to produce a 24-step synthetic window, scored by a critic trained with WGAN-GP. Results against baseline: 98.2% lower kurtosis error, 94% lower skewness deviation, 68.7% lower KS statistic, ACF MSE of 0.0107 over 20 lags.</title><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'Noto Sans', Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.fg{fill:#1F2328}.tx{fill:#3B434B}.mu{fill:#59636E}.fa{fill:#818B98}.ac{fill:#1D5FD6}.on{fill:#FFFFFF}
.b{font-weight:600}
.hair{stroke:#1F2328;stroke-opacity:.16;fill:none}
.panel{fill:#1F2328;fill-opacity:.03;stroke:#1F2328;stroke-opacity:.15}
.node{fill:#1F2328;fill-opacity:.04;stroke:#1F2328;stroke-opacity:.24}
.node-ac{fill:#1D5FD6;fill-opacity:.12;stroke:#1D5FD6;stroke-opacity:.75}
.wire{stroke:#59636E;stroke-width:1.3;fill:none}
.wire-ac{stroke:#1D5FD6;stroke-width:1.5;fill:none}
.head{fill:#59636E}.head-ac{fill:#1D5FD6}
.group{fill:none;stroke:#1F2328;stroke-opacity:.14;stroke-dasharray:3 4}.loop{stroke-dasharray:5 5;animation:march 1.6s linear infinite}@keyframes march{to{stroke-dashoffset:-20}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 .8 7.2 4 0 7.2z" class="head"/></marker><marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 .8 7.2 4 0 7.2z" class="head-ac"/></marker></defs><rect x=".5" y=".5" width="799" height="339" rx="10" class="panel"/><text x="24" y="33" font-size="12" letter-spacing="1.4" class="mono fg b">TBC-GAN</text><text x="776" y="33" font-size="11.5" text-anchor="end" class="mono mu">VSTOXX volatility index, 2,000+ trading days</text><rect x="150.5" y="78.5" width="384" height="86" rx="10" class="group"/><text x="162" y="70" font-size="10.5" letter-spacing="1.6" class="mono mu">GENERATOR</text><rect x="24.0" y="94.0" width="100.0" height="56.0" rx="8" class="node"/><text x="74.0" y="119.0" text-anchor="middle" font-size="13.5" class="fg b">noise z</text><text x="74.0" y="136.0" text-anchor="middle" font-size="10.5" class="mono mu">+ condition</text><path d="M127.0 122.0L147.0 122.0" class="wire" marker-end="url(#a)"/><rect x="162.0" y="94.0" width="112.0" height="56.0" rx="8" class="node"/><text x="218.0" y="119.0" text-anchor="middle" font-size="13.5" class="fg b">Transformer</text><text x="218.0" y="136.0" text-anchor="middle" font-size="10.5" class="mono mu">global context</text><rect x="286.0" y="94.0" width="112.0" height="56.0" rx="8" class="node"/><text x="342.0" y="119.0" text-anchor="middle" font-size="13.5" class="fg b">BiLSTM</text><text x="342.0" y="136.0" text-anchor="middle" font-size="10.5" class="mono mu">sequence memory</text><path d="M276.0 122.0L284.0 122.0" class="wire" marker-end="url(#a)"/><rect x="410.0" y="94.0" width="112.0" height="56.0" rx="8" class="node"/><text x="466.0" y="119.0" text-anchor="middle" font-size="13.5" class="fg b">CNN</text><text x="466.0" y="136.0" text-anchor="middle" font-size="10.5" class="mono mu">local patterns</text><path d="M400.0 122.0L408.0 122.0" class="wire" marker-end="url(#a)"/><path d="M537.0 122.0L553.0 122.0" class="wire" marker-end="url(#a)"/><rect x="556.0" y="94.0" width="108.0" height="56.0" rx="8" class="node"/><text x="610.0" y="119.0" text-anchor="middle" font-size="13.5" class="fg b">synthetic</text><text x="610.0" y="136.0" text-anchor="middle" font-size="10.5" class="mono mu">24-step window</text><path d="M667.0 122.0L685.0 122.0" class="wire" marker-end="url(#a)"/><rect x="688.0" y="94.0" width="88.0" height="56.0" rx="8" class="node-ac"/><text x="732.0" y="119.0" text-anchor="middle" font-size="13.5" class="fg b">critic</text><text x="732.0" y="136.0" text-anchor="middle" font-size="10.5" class="mono mu">realism score</text><text x="732" y="64" font-size="10.5" text-anchor="middle" class="mono mu">real window</text><path d="M732.0 70.0L732.0 91.0" class="wire" marker-end="url(#a)"/><path d="M732 153V192H342V168" class="wire-ac loop" marker-end="url(#b)"/><text x="537" y="211" font-size="11" text-anchor="middle" class="mono ac">WGAN-GP: Wasserstein loss + gradient penalty</text><path d="M24 236.5h752" class="hair"/><text x="24" y="286" font-size="36" font-weight="700" letter-spacing="-1" class="fg">98.2%</text><text x="25" y="311" font-size="11.5" class="mono mu">lower kurtosis error</text><text x="214" y="286" font-size="36" font-weight="700" letter-spacing="-1" class="fg">94%</text><text x="215" y="311" font-size="11.5" class="mono mu">lower skewness deviation</text><text x="404" y="286" font-size="36" font-weight="700" letter-spacing="-1" class="fg">68.7%</text><text x="405" y="311" font-size="11.5" class="mono mu">lower KS statistic</text><text x="594" y="286" font-size="36" font-weight="700" letter-spacing="-1" class="fg">0.0107</text><text x="595" y="311" font-size="11.5" class="mono mu">ACF MSE over 20 lags</text></svg>
